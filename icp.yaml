# yaml-language-server: $schema=http://raw.githubusercontent.com/dfinity/icp-cli/refs/tags/v0.2.0/docs/schemas/icp-yaml-schema.json
canisters:
  - name: compression
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: example/compress.mo
        args: ""

  - name: image-compression
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: example/compress-images.mo
        args: ""

  - name: external-decompress
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: example/external-decompress.mo
        args: ""

networks:
  - name: local
    mode: managed

environments:
  - name: local
    network: local
    canisters: [compression, image-compression, external-decompress]
